<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening Velocity Drive…</title>
    <script>
      (function () {
        var repository = "/velocity-drive-rental";
        var isProjectSite = window.location.hostname.endsWith("github.io") && window.location.pathname.indexOf(repository + "/") === 0;
        var base = isProjectSite ? repository : "";
        var route = window.location.pathname.slice(base.length) + window.location.search + window.location.hash;
        window.location.replace(base + "/?path=" + encodeURIComponent(route || "/"));
      })();
    </script>
  </head>
  <body>Opening Velocity Drive…</body>
</html>
